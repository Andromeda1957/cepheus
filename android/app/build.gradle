plugins {
    id 'com.android.application'
    alias(libs.plugins.kotlin.compose)
}

// Release signing is opt-in. Keep the keystore and passwords outside Git.
def releaseKeystorePath = System.getenv('CEPHEUS_KEYSTORE')
def releaseKeyAlias = System.getenv('CEPHEUS_KEY_ALIAS')
def releaseStorePassword = System.getenv('CEPHEUS_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('CEPHEUS_KEY_PASSWORD')
def releaseSigningAvailable = releaseKeystorePath && releaseKeyAlias &&
        file(releaseKeystorePath).exists() &&
        releaseStorePassword &&
        releaseKeyPassword

android {
    namespace 'io.github.cepheus.app'
    compileSdk = 37

    defaultConfig {
        applicationId 'io.github.cepheus.app'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '1.5'
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests.all {
            // Use an explicitly selected temporary directory when supplied.
            def scratch = System.getenv('CEPHEUS_TEST_TMPDIR')
            if (scratch) {
                systemProperty 'java.io.tmpdir', scratch
            }
        }
    }
}

dependencies {
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.androidx.core
    implementation libs.coroutines.android
    implementation libs.okhttp
    implementation libs.code.scanner

    testImplementation libs.junit
    // Android's own org.json is a stub on the JVM; tests use the reference one.
    testImplementation libs.json
}
