[package]
name = "cepheus"
version = "0.1.0"
edition = "2021"
description = "A terminal workspace and background service for AI coding agents"
license = "MIT"
publish = false
exclude = ["docs/screenshots/**"]

[[bin]]
name = "cepheus"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
crossterm = "0.29"
# Dot's pet sheet (WebP, from OpenAI's public CDN) decoded for kitty.
image-webp = "0.2"
libc = "0.2"
memchr = "2"
# The deck's Lua API (`lua.rs`): Lua 5.4 built in, so no system Lua is needed.
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
portable-pty = "0.9"
pulldown-cmark = { version = "0.10", default-features = false }
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# The api-cost collector's usage database, with SQLite compiled in.
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
time = { version = "0.3", features = ["parsing"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
debug = false
